<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF Viewer</title>
  <style>
    body, html { 
      margin: 0; 
      padding: 0; 
      height: 100%; 
      overflow: hidden; 
    }
    .header {
      background-color: #007bff; 
      color: white; 
      padding: 10px;
      text-align: center; 
      position: fixed; 
      top: 0; 
      width: 100%; 
      z-index: 1000;
      box-sizing: border-box;
    }
    .pdf-container {
      margin-top: 50px; 
      height: calc(100vh - 50px);
    }
    iframe { 
      width: 100%; 
      height: 100%; 
      border: none; 
    }
    h2 {
      margin: 0;
    }
  </style>
</head>
<body>
  <div class="header">
    <h2>PDF Viewer</h2>
  </div>
  <div class="pdf-container">
    <iframe src="https://github.com/moguura/minnano_nihongo_pdf/raw/main/L25tara_if.pdf" allowfullscreen></iframe>
  </div>
</body>
</html>
