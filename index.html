<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
  <title>PDF Viewer</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
    }

    .header {
      background-color: #007bff;
      color: white;
      padding: 10px;
      box-sizing: border-box;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      flex-shrink: 0;
    }

    h2 {
      margin: 0;
      font-size: 18px;
    }

    .controls {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    button {
      background-color: rgba(255, 255, 255, 0.2);
      border: 1px solid white;
      color: white;
      padding: 5px 10px;
      cursor: pointer;
      border-radius: 4px;
      font-size: 14px;
      white-space: nowrap;
    }

    button:hover {
      background-color: rgba(255, 255, 255, 0.3);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .page-info {
      color: white;
      font-size: 14px;
      min-width: 70px;
      text-align: center;
    }

    /* PDFを表示する領域 */
    .pdf-container {
      flex: 1;
      min-height: 0;
      min-width: 0;
      box-sizing: border-box;
      overflow: auto;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #f0f0f0;
      padding: 10px;
    }

    #pdf-canvas {
      display: block;
      flex-shrink: 0;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
    }

    /* スマートフォン対応 */
    @media (max-width: 768px) {
      .header {
        padding: 8px;
      }

      h2 {
        font-size: 16px;
      }

      .controls {
        gap: 5px;
        width: 100%;
        justify-content: center;
      }

      button {
        padding: 3px 6px;
        font-size: 11px;
      }

      .page-info {
        font-size: 11px;
        min-width: 60px;
      }

      .pdf-container {
        padding: 5px;
      }
    }
/* 通常は案内を非表示 */
.rotate-notice {
  display: none;
  flex-shrink: 0;
}

/* スマホが縦向きのときだけ案内を表示 */
@media (max-width: 768px) and (orientation: portrait) {
  .rotate-notice {
    display: block;
    background-color: #fff3cd;
    color: #856404;
    text-align: center;
    padding: 10px;
    font-size: 14px;
    line-height: 1.5;
  }
}

/* スマホを横向きにしたとき */
@media (orientation: landscape) and (max-height: 600px) {

  .header {
    flex-wrap: nowrap;
    padding: 4px 8px;
    gap: 6px;
  }

  h2 {
    font-size: 13px;
    flex: 1;
    white-space: nowrap;
  }

  .controls {
    width: auto;
    flex-shrink: 0;
    margin-top: 0;
    gap: 5px;
  }

  button {
    padding: 3px 6px;
    font-size: 11px;
  }

  .page-info {
    min-width: auto;
    font-size: 11px;
  }

  .pdf-container {
    padding: 2px;
  }
} 
  </style>
</head>

<body>
  <div class="header">
    <h2>PDF Viewer</h2>

    <div class="controls">
      <button id="prev-btn" onclick="prevPage()">
        ← Previous
      </button>

      <span class="page-info">
        <span id="current-page">1</span>
        /
        <span id="total-pages">0</span>
      </span>

      <button id="next-btn" onclick="nextPage()">
        Next →
      </button>
    </div>
  </div>

  <div class="rotate-notice">
  📱 For a larger view, please turn your phone sideways.<br>
  If the screen doesn't rotate, please enable auto-rotate in your phone's settings.
  </div>
  
  <div class="pdf-container">
    <canvas id="pdf-canvas"></canvas>
  </div>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    const pdfUrl = './L25_Kaiwa.pdf';

    let pdfDoc = null;
    let currentPage = 1;
    let isRendering = false;
    let renderAgain = false;

    async function loadPdf() {
      try {
        pdfDoc = await pdfjsLib.getDocument(pdfUrl).promise;

        document.getElementById('total-pages')
          .textContent = pdfDoc.numPages;

        updateControls();
        renderPage();

      } catch (error) {
        console.error('PDF読み込みエラー:', error);
        alert('PDFの読み込みに失敗しました。URLを確認してください。');
      }
    }

    function updateControls() {
      document.getElementById('current-page')
        .textContent = currentPage;

      document.getElementById('prev-btn')
        .disabled = currentPage === 1;

      document.getElementById('next-btn')
        .disabled = currentPage === pdfDoc.numPages;
    }

    async function renderPage() {
      if (!pdfDoc) return;

      // 描画中にページ変更やサイズ変更があった場合
      if (isRendering) {
        renderAgain = true;
        return;
      }

      isRendering = true;

      try {
        do {
          renderAgain = false;

          const pageNum = currentPage;
          const page = await pdfDoc.getPage(pageNum);

          if (pageNum !== currentPage) {
            renderAgain = true;
            continue;
          }

          const canvas =
            document.getElementById('pdf-canvas');

          const container =
            document.querySelector('.pdf-container');

          const style = getComputedStyle(container);

          // 表示領域の横幅を計算
          const availableWidth = Math.max(
            1,
            container.clientWidth
              - parseFloat(style.paddingLeft)
              - parseFloat(style.paddingRight)
              - 2
          );

          // 表示領域の縦幅を計算
          const availableHeight = Math.max(
            1,
            container.clientHeight
              - parseFloat(style.paddingTop)
              - parseFloat(style.paddingBottom)
              - 2
          );

          // PDF本来のサイズ
          const viewport = page.getViewport({
            scale: 1
          });

          // ★ 横幅・縦幅の両方に収まる倍率を選択
          const scale = Math.min(
            availableWidth / viewport.width,
            availableHeight / viewport.height
          );

          const scaledViewport = page.getViewport({
            scale: scale
          });

          // 高解像度ディスプレイ対応
          const dpr = Math.min(
            window.devicePixelRatio || 1, 2
          );

          const context = canvas.getContext('2d');

          canvas.width =
            Math.round(scaledViewport.width * dpr);

          canvas.height =
            Math.round(scaledViewport.height * dpr);

          canvas.style.width =
            scaledViewport.width + 'px';

          canvas.style.height =
            scaledViewport.height + 'px';

          context.setTransform(dpr, 0, 0, dpr, 0, 0);

          await page.render({
            canvasContext: context,
            viewport: scaledViewport
          }).promise;

        } while (renderAgain || pageNumChanged());

      } catch (error) {
        console.error('PDF描画エラー:', error);
      } finally {
        isRendering = false;
      }
    }

    // 現在のページ番号は描画要求時に更新されるため、
    // 再描画が必要な場合はrenderAgainで管理する
    function pageNumChanged() {
      return renderAgain;
    }

    function nextPage() {
      if (pdfDoc && currentPage < pdfDoc.numPages) {
        currentPage++;
        updateControls();
        renderPage();
      }
    }

    function prevPage() {
      if (pdfDoc && currentPage > 1) {
        currentPage--;
        updateControls();
        renderPage();
      }
    }

    // ウィンドウサイズ変更時に再描画
    window.addEventListener('resize', () => {
      if (pdfDoc) {
        renderPage();
      }
    });

    loadPdf();
  </script>
</body>
</html>
